name: Deploy to Vercel (production)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-site.mjs
      - run: node scripts/check-lead-proxy.mjs
  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      # Audit the artifact that actually ships. The `check` job builds without the
      # Vercel env, so only this step sees NEXT_PUBLIC_* values as inlined for
      # production — e.g. a stale NEXT_PUBLIC_PORTAL_URL on a retired host fails
      # here instead of deploying dead client-login links. (`vercel build` runs
      # `next build` in place, so .next/server/app is present.)
      - run: node scripts/check-site.mjs
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
